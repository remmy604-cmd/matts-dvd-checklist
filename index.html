<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Matt's Film Star Checklist</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#101827;color:#f5f7fa;font:16px system-ui}header{padding:22px;background:#19263a}h1{margin:0;font-size:23px}main{max-width:700px;margin:auto;padding:16px}button,input,select{font:inherit;border-radius:9px;padding:11px;border:1px solid #53647b}button{background:#24a67b;color:white;border:0;cursor:pointer}input,select{background:#1b2a3d;color:white;max-width:100%;box-sizing:border-box}section{background:#19263a;padding:16px;border-radius:14px;margin-bottom:15px} .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.film{display:flex;align-items:center;gap:10px;border-bottom:1px solid #354256;padding:10px 0}.film label{flex:1}.film small{color:#aab7c8}.muted{color:#aab7c8}.danger{background:#9e4050}.secondary{background:#34465e}input[type=checkbox]{width:22px;height:22px;accent-color:#24a67b}#movies{margin-top:12px}.tiny{font-size:13px}button:focus-visible,input:focus-visible{outline:3px solid #e1ba57}</style></head><body><header><h1>🎬 Matt's Film Star Checklist</h1><div class="muted">Your DVD collection, star by star</div></header><main><section><div class="bar"><select id="star" aria-label="Choose actor"></select><button id="newstar">+ Add star</button></div><p id="stats"></p><div class="bar"><input id="search" placeholder="Search films" aria-label="Search films"><select id="filter"><option value="all">All films</option><option value="missing">Missing</option><option value="owned">Owned</option></select></div></section><section><div class="bar"><input id="year" placeholder="Year" inputmode="numeric" style="width:90px"><input id="title" placeholder="Film title" style="flex:1;min-width:130px"><button id="addfilm">+ Add film</button></div><div id="movies"></div></section><section><strong>Backup and restore</strong><p class="muted tiny">Your list is saved on this device. Export a backup regularly, especially before clearing browser data or changing phones.</p><div class="bar"><button id="export">Download backup</button><label class="secondary" style="padding:11px;border-radius:9px;cursor:pointer">Restore backup <input type="file" id="import" accept="application/json,.json" hidden></label></div></section></main><script src="app.js"></script></body></html>
